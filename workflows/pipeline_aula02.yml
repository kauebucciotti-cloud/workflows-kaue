name: Pipeline_Aula_2

on: 
  push: 
    branches:
      - main

jobs: 
  build:
    # Corrigido de "unbutu-letest" para "ubuntu-latest"
    runs-on: ubuntu-latest

    steps: 
      - name: Checkout codigo
        # Corrigido de "action/checkout" para "actions/checkout"
        uses: actions/checkout@v3
      
      - name: Configurar Python
        # Corrigido de "stup-python" para "setup-python"
        uses: actions/setup-python@v4
        # Corrigido de "whith" para "with"
        with: 
          python-version: '3.11'

      - name: instalar dependencias
        run: |
          python -m pip install --upgrade pip
          # Removi um "install" duplicado que estava no meio do comando
          pip install -r requirements.txt 

      - name: Rodar testes
        # Se você não tiver o arquivo de teste ou o pytest instalado, o job vai falhar aqui
        run: |
          pytest

  deploy: 
    runs-on: ubuntu-latest
    needs: build

    steps: 
      - name: Simular deploy
        # O "run" precisa estar alinhado com o "name" dentro de steps
        run: echo "Deploy realizado com sucesso"